name: press

on:
  schedule:
    - cron: "40 18 * * *" # 23:40 in Tashkent (UTC+5), so the day is nearly complete
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/press.mjs, .github/workflows/press.yml]

permissions:
  contents: write

concurrency:
  group: press
  cancel-in-progress: false

jobs:
  press:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Draw the record
        run: node scripts/press.mjs --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The SVGs live on their own branch as a single commit, so main keeps a clean history.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Redraw $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
